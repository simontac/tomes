<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- This is the header of the app -->
        <h1>
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 19V6.2C4 5.0799 4 4.51984 4.21799 4.09202C4.40973 3.71569 4.71569 3.40973 5.09202 3.21799C5.51984 3 6.0799 3 7.2 3H16.8C17.9201 3 18.4802 3 18.908 3.21799C19.2843 3.40973 19.5903 3.71569 19.782 4.09202C20 4.51984 20 5.0799 20 6.2V17H6C4.89543 17 4 17.8954 4 19ZM4 19C4 20.1046 4.89543 21 6 21H20M9 7H15M9 11H15M19 17V21" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

                <path d="M4 12H20M12 4V20" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </h1>        
        <p>Add and update books from your collection.</p>

        <!-- This is the form to add books to the collection -->
        <div class="add-book-popup-form hidden">
            <input id="new-book-title" type="text" placeholder="Title">
            <input id="new-book-author" type="text" placeholder="Author">
            <button id="fetch-book-data-button">Search</button>
        </div>

        <!--- Toggle to sort either by rating or reading date -->
        <div class="entries-sort">
            Sort by rating:
            <svg viewBox="0 -3 20 20">
                <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">

                </g>
                </g>

        </div>

    <!-- Retrieving books from JSON file -->
    <script src="fetch_books.js"></script>
    <script src="script.js"></script>
</body>
</html>
